<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>상품마케팅팀 주간보고 - 제품 개발 파이프라인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">

<!-- Firebase SDK 라이브러리 추가 -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
  :root{
    --ink:#1b202b; --ink-soft:#5c6675; --ink-muted:#7d8794;
    --paper:#f4f2ec; --card:#fbfaf6; --line:#e3ded3; --line-strong:#d0c9b8;
    --accent:#2f5d8a; --accent-soft:#eef3f9; --accent-ink:#1f4166;
    --amber:#b5720f; --amber-soft:#f6ecd9; --amber-ink:#8a5c12;
    --forest:#3a7d44; --forest-soft:#e3f0e4; --forest-ink:#275c2e;
    --slate:#5c6675; --slate-soft:#ece7db; --slate-ink:#4a5361;
    --danger:#b5532a; --danger-soft:#f6e7dc;
    --t0:#5a6472; --t0-soft:#eef0f3; --t0-ink:#3d4653;
    --t1:#1f7a70; --t1-soft:#e6f2f0; --t1-ink:#155c54;
    --t2:#2f5d8a; --t2-soft:#eef3f9; --t2-ink:#1f4166;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: "YoonGothic", "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;

    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
    --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
    --sh-1:0 1px 2px rgba(40,35,25,.05);
    --sh-2:0 2px 8px rgba(40,35,25,.07), 0 1px 2px rgba(40,35,25,.04);
    --sh-3:0 8px 24px rgba(40,35,25,.10), 0 2px 6px rgba(40,35,25,.05);
  }
  *{box-sizing:border-box}
  html{background:var(--paper)}
  body{
    font-family:var(--sans);
    background:radial-gradient(1200px 600px at 80% -10%, #efe9dc 0, transparent 60%), var(--paper);
    color:var(--ink); margin:0; padding:var(--sp-6) var(--sp-6) var(--sp-7);
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:'';position:fixed;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--accent-ink),var(--accent) 50%,var(--amber));
    z-index:100;
  }
  .eyebrow{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin:0 0 var(--sp-2);display:flex;align-items:center;gap:var(--sp-2);
  }
  .eyebrow::before{content:'';width:16px;height:2px;background:var(--accent);border-radius:2px;flex-shrink:0}
  h1{font-size:30px;font-weight:800;margin:0 0 var(--sp-2);letter-spacing:-.022em;line-height:1.2;color:var(--accent-ink)}
  h2{
    font-size:16px;font-weight:700;margin:0 0 var(--sp-4);letter-spacing:-.01em;color:var(--ink);
    display:flex;align-items:center;gap:var(--sp-2);
  }
  h2::before{content:'';width:3px;height:15px;border-radius:2px;background:var(--accent);flex-shrink:0}
  .sub{font-size:13.5px;color:var(--ink-soft);margin:0 0 var(--sp-5);max-width:680px;line-height:1.6}

  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-3);margin-bottom:var(--sp-6)}
  .metric{
    position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:var(--sp-4) var(--sp-5);box-shadow:var(--sh-2);overflow:hidden;
    transition:transform .14s, box-shadow .14s;
  }
  .metric::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--accent),var(--accent-ink));
  }
  .metric:hover{transform:translateY(-2px);box-shadow:var(--sh-3)}
  .metric p{margin:0}
  .metric .label{
    font-size:11px;color:var(--ink-muted);margin-bottom:var(--sp-2);letter-spacing:.06em;
    text-transform:uppercase;font-weight:600;
  }
  .metric .value{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--amber-ink)}

  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:var(--sp-5);margin-bottom:var(--sp-5);box-shadow:var(--sh-2);
  }
  .add-row{display:grid;grid-template-columns:110px 1fr 160px 90px;gap:var(--sp-2);margin-bottom:var(--sp-3)}
  input, select{
    font-size:13px;padding:8px 11px;border-radius:var(--r-sm);border:1px solid var(--line-strong);
    background:var(--card);color:var(--ink);font-family:var(--sans);
    transition:border-color .12s, box-shadow .12s;
  }
  input:hover, select:hover{border-color:var(--ink-muted)}
  input[type=date]{font-family:var(--mono);font-size:12px;color-scheme:light}
  input[type=date]::-webkit-calendar-picker-indicator{
    cursor:pointer;padding:4px;border-radius:5px;background:var(--accent-soft);
  }
  input[type=date]::-webkit-calendar-picker-indicator:hover{background:var(--accent);filter:brightness(1.4)}
  input:focus, select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  button{
    font-size:13px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line-strong);
    background:var(--card);color:var(--ink);cursor:pointer;font-family:var(--sans);font-weight:600;
    transition:border-color .12s, background .12s, box-shadow .12s, transform .1s;
    box-shadow:var(--sh-1);
  }
  button:hover{border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--sh-2)}
  button.primary{
    background:linear-gradient(180deg,var(--accent),var(--accent-ink));
    color:#fdfcf9;border-color:var(--accent-ink);font-weight:700;box-shadow:var(--sh-2);
  }
  button.primary:hover{filter:brightness(1.08);color:#fff;box-shadow:var(--sh-3)}
  button:active{transform:translateY(1px)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{
    text-align:left;color:var(--ink-muted);font-weight:700;font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;padding:0 var(--sp-2) var(--sp-2);border-bottom:1.5px solid var(--line-strong);
    white-space:nowrap;
  }
  td{padding:10px var(--sp-2);border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink)}
  tbody tr{transition:background .1s}
  tbody tr:hover td{background:var(--accent-soft)}
  .del-btn{color:var(--danger);border-color:transparent;background:transparent;padding:4px 8px;font-weight:600;box-shadow:none}
  .del-btn:hover{border-color:var(--danger);background:var(--danger-soft);color:var(--danger);box-shadow:none}
  .link-btn{
    background:none;border:none;color:var(--accent-ink);cursor:pointer;padding:0;
    font-size:13px;font-weight:600;font-family:var(--sans);
  }
  .link-btn:hover{text-decoration:underline}

  .status-msg{font-size:12px;color:var(--ink-muted);margin-top:6px;min-height:16px;line-height:1.6}
  .status-msg.err{color:var(--danger)}
  .footer-actions{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);margin-top:var(--sp-3);flex-wrap:wrap}
  .badge{
    display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:var(--r-pill);
    font-size:10.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;
  }
  .badge::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0}
  .badge.완료{background:var(--forest-soft);color:var(--forest-ink)}
  .badge.완료::before{background:var(--forest)}
  .badge.진행{background:var(--amber-soft);color:var(--amber-ink)}
  .badge.진행::before{background:var(--amber)}
  .badge.예정{background:var(--slate-soft);color:var(--slate-ink)}
  .badge.예정::before{background:var(--slate)}

  .team-tabs{
    display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--sp-4);
    padding-bottom:var(--sp-3);border-bottom:2px solid var(--line);
  }
  .team-tabs button{
    padding:10px 22px;font-size:14px;font-weight:700;border-radius:var(--r-md) var(--r-md) 0 0;
    background:transparent;border:none;border-bottom:3px solid transparent;
    color:var(--ink-muted);box-shadow:none;margin-bottom:-15px;cursor:pointer;
  }
  .team-tabs button:hover{background:var(--slate-soft)}
  .team-tabs button.active{
    color:var(--accent-ink);
    border-bottom:3px solid var(--accent);
    background:var(--card);
  }

  .sec-nav{
    position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:7px;align-items:center;
    padding:12px 16px;margin-bottom:var(--sp-5);border-radius:var(--r-md);
    background:linear-gradient(180deg, var(--accent-ink), var(--accent));
    border:1px solid var(--accent-ink);
    box-shadow:0 4px 16px rgba(31,65,102,.28);
  }
  .sec-nav-label{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-weight:800;letter-spacing:.1em;color:#fff;
    text-transform:uppercase;margin-right:6px;opacity:.95;
  }
  .sec-nav button{
    padding:6px 13px;font-size:12px;font-weight:700;border-radius:var(--r-pill);
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.30);
    color:#fff;box-shadow:none;transition:background .12s, transform .12s;
  }
  .sec-nav button:hover{background:rgba(255,255,255,.30);color:#fff;transform:translateY(-1px)}
</style>
</head>
<body>

<div id="list-view">
  <div class="footer-actions" style="margin-bottom:4px">
    <div>
      <p class="eyebrow">상품마케팅팀 · 운영 대시보드</p>
      <h1 id="page-title">상품마케팅2팀 주간업무 현황</h1>
      <p class="sub" style="margin-bottom:0">STEP 1~6 / NPDC GATE 1~3 기준으로 프로젝트가 어느 단계에 있는지 매주 갱신해서 보는 화면입니다. 프로젝트명을 클릭하면 일정 상세를 볼 수 있어요.</p>
    </div>
    <button onclick="manualRefresh()" style="flex-shrink:0">🔄 새로고침</button>
  </div>
  <p class="status-msg" id="live-status" style="margin:0 0 10px"></p>

  <!-- 팀 선택 탭 -->
  <div class="team-tabs" id="team-tabs">
    <button id="tab-all" data-team="all" onclick="setTeam('all')">전체 현황</button>
    <button id="tab-team1" data-team="team1" onclick="setTeam('team1')">상품마케팅1팀</button>
    <button id="tab-team2" data-team="team2" class="active" onclick="setTeam('team2')">상품마케팅2팀</button>
  </div>

  <div class="footer-actions" style="margin-bottom:12px">
    <p class="status-msg" style="margin:0">백업은 <b>보고 있는 탭 기준</b>으로 저장·불러오기돼요.</p>
    <div style="display:flex;gap:8px">
      <button onclick="exportBackup()">📤 백업 저장 (JSON)</button>
      <button onclick="document.getElementById('backup-file-input').click()">📥 백업 불러오기</button>
      <input type="file" id="backup-file-input" accept=".json,application/json" style="display:none" onchange="importBackup(event)">
    </div>
  </div>

  <div class="panel" id="add-panel">
    <h2>프로젝트 추가</h2>
    <div class="add-row" style="grid-template-columns:110px 1fr 160px 90px">
      <input id="in-owner" placeholder="담당자">
      <input id="in-name" placeholder="프로젝트명 / 업무명">
      <select id="in-stage"></select>
      <button class="primary" onclick="addProject()">추가</button>
    </div>
    <div class="status-msg err" id="add-error"></div>
  </div>

  <div class="panel" id="project-list-panel">
    <h2>프로젝트 목록</h2>
    <table>
      <thead><tr><th>팀</th><th>담당자</th><th>프로젝트명</th><th>요약</th><th style="width:170px">현재 단계</th><th style="width:60px"></th></tr></thead>
      <tbody id="proj-body"></tbody>
    </table>
    <div class="footer-actions">
      <span class="status-msg" id="save-status"></span>
    </div>
  </div>
</div>

<script>
// ==========================================
// 1. Firebase 연동 설정
// ==========================================
const firebaseConfig = {
  databaseURL: "https://project-dashboard-2431e-default-rtdb.firebaseio.com/"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

const STAGES = ["STEP.1","GATE 1","STEP.2","STEP.3","STEP.4","STEP.4-1","GATE 2","STEP.5","STEP.6","GATE 3"];
const STAGE_LABEL = {
  "STEP.1":"STEP.1 제품 기획","GATE 1":"GATE 1","STEP.2":"STEP.2 샘플링/품질",
  "STEP.3":"STEP.3 원가/가격","STEP.4":"STEP.4 표기사항","STEP.4-1":"STEP.4-1 디자인",
  "GATE 2":"GATE 2","STEP.5":"STEP.5 포장재 발주","STEP.6":"STEP.6 출시/피드백","GATE 3":"GATE 3 포스트런칭"
};

let projects = [];
let activeTeam = 'team2'; // 기본 선택: 상품마케팅2팀

const TEAMS = {
  all: { label: '상품마케팅팀 전체 주간업무 현황' },
  team1: { label: '상품마케팅1팀 주간업무 현황' },
  team2: { label: '상품마케팅2팀 주간업무 현황' }
};

// 💡 탭 전환 함수 (수정 보완됨)
function setTeam(team) {
  activeTeam = team;

  // 1. 탭 버튼 디자인(active 클래스) 업데이트
  document.querySelectorAll('.team-tabs button').forEach(btn => {
    if (btn.getAttribute('data-team') === team) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });

  // 2. 상단 제목 업데이트
  const pageTitle = document.getElementById('page-title');
  if (pageTitle && TEAMS[team]) {
    pageTitle.textContent = TEAMS[team].label;
  }

  // 3. 목록 다시 그리기
  render();
}

function normalizeProject(p) {
  if (!p.steps) p.steps = STAGES.map(s => ({stage:s, status:"예정", content:""}));
  if (!p.team) p.team = 'team2';
  return p;
}

function currentStageOf(proj) {
  for (const s of STAGES) {
    const step = proj.steps.find(x => x.stage === s);
    if (step && step.status !== "완료") return s;
  }
  return STAGES[STAGES.length - 1];
}

// Data Load
function loadData() {
  database.ref('projects_v2').on('value', (snapshot) => {
    const val = snapshot.val();
    projects = val ? JSON.parse(val) : [];
    projects.forEach(normalizeProject);
    render();
    
    const el = document.getElementById('live-status');
    if (el) el.textContent = '🟢 Firebase DB 연동 완료 (' + new Date().toLocaleTimeString('ko-KR') + ')';
  });
}

function manualRefresh() { loadData(); }

async function saveData(statusElId) {
  const statusEl = document.getElementById(statusElId);
  if (statusEl) statusEl.textContent = '저장 중...';
  try {
    await database.ref('projects_v2').set(JSON.stringify(projects));
    if (statusEl) statusEl.textContent = '저장됨 (' + new Date().toLocaleTimeString('ko-KR') + ')';
    return true;
  } catch (e) {
    if (statusEl) statusEl.textContent = '⚠ 저장 실패';
    return false;
  }
}

// 백업 업로드 시 team 보정 처리
function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const importedData = JSON.parse(e.target.result);
      if (!Array.isArray(importedData)) return;

      importedData.forEach(p => {
        if (!p.team) p.team = (activeTeam && activeTeam !== 'all') ? activeTeam : 'team2';
        normalizeProject(p);
      });

      if (confirm(`총 ${importedData.length}개의 프로젝트 데이터를 반영하시겠습니까?`)) {
        projects = importedData;
        await saveData('save-status');
        alert("백업 파일이 성공적으로 반영되었습니다!");
        render();
      }
    } catch (err) {
      alert("백업 파일을 읽는 중 오류가 발생했습니다.");
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function exportBackup() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projects, null, 2));
  const dlAnchorElem = document.createElement('a');
  dlAnchorElem.setAttribute("href", dataStr);
  dlAnchorElem.setAttribute("download", `백업_${activeTeam}_${new Date().toISOString().slice(0,10)}.json`);
  dlAnchorElem.click();
}

function addProject() {
  const owner = document.getElementById('in-owner').value.trim();
  const name = document.getElementById('in-name').value.trim();
  const stage = document.getElementById('in-stage').value;
  if (!owner || !name) return;

  const steps = STAGES.map(s => ({stage: s, status: "예정", content: ""}));
  const idx = STAGES.indexOf(stage);
  steps.forEach((s, i) => { if (i < idx) s.status = "완료"; });

  // 현재 선택된 탭에 맞춰 팀 부여 (전체 탭일 경우 기본 team2)
  const projTeam = (activeTeam === 'all') ? 'team2' : activeTeam;

  projects.push({
    id: Date.now() + Math.random(),
    owner, name, steps, team: projTeam
  });

  document.getElementById('in-owner').value = '';
  document.getElementById('in-name').value = '';
  saveData('save-status');
  render();
}

function deleteProject(id) {
  projects = projects.filter(x => x.id !== id);
  saveData('save-status');
  render();
}

function populateStageSelect() {
  const sel = document.getElementById('in-stage');
  sel.innerHTML = "";
  STAGES.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = STAGE_LABEL[s];
    sel.appendChild(opt);
  });
}

// 💡 데이터 렌더링 (선택된 팀 필터링 반영)
function render() {
  populateStageSelect();

  // 선택된 탭(activeTeam)에 맞춰 데이터 필터링
  let activeProjects = projects.filter(p => {
    if (activeTeam === 'all') return true;
    return p.team === activeTeam;
  });

  const body = document.getElementById('proj-body');
  body.innerHTML = '';

  activeProjects.forEach(p => {
    const tr = document.createElement('tr');
    
    const tdTeam = document.createElement('td');
    tdTeam.textContent = p.team === 'team1' ? '1팀' : '2팀';

    const tdOwner = document.createElement('td'); 
    tdOwner.textContent = p.owner;

    const tdName = document.createElement('td');
    tdName.textContent = p.name;

    const tdSummary = document.createElement('td');
    const curStep = p.steps.find(s => s.stage === currentStageOf(p));
    tdSummary.textContent = (curStep && curStep.content) ? curStep.content : '—';

    const tdStage = document.createElement('td');
    tdStage.innerHTML = '<span class="badge">' + STAGE_LABEL[currentStageOf(p)] + '</span>';

    const tdDel = document.createElement('td');
    const delBtn = document.createElement('button');
    delBtn.className = 'del-btn'; delBtn.textContent = '삭제';
    delBtn.onclick = () => deleteProject(p.id);
    tdDel.appendChild(delBtn);

    tr.append(tdTeam, tdOwner, tdName, tdSummary, tdStage, tdDel);
    body.appendChild(tr);
  });
}

// 최초 로드 실행
loadData();
</script>
</body>
</html>
